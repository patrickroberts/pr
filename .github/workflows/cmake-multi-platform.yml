name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os: [ubuntu-latest]
        build_type: [Debug, Release]
        cxx_compiler: [clang++-19, g++-15]
        include:
          - os: windows-latest
            build_type: Debug
            cxx_compiler: msvc
          - os: windows-latest
            build_type: Release
            cxx_compiler: msvc

    steps:
    - uses: actions/checkout@v4

    - name: Install Clang and libc++
      if: matrix.cxx_compiler == 'clang++-19'
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-19 libc++-19-dev libc++abi-19-dev libunwind-19-dev

    - name: Configure CMake (Clang)
      if: matrix.cxx_compiler == 'clang++-19'
      run: >
        cmake -B build
        -DCMAKE_TOOLCHAIN_FILE=cmake/clang-libcxx.cmake
        -DCMAKE_CXX_COMPILER=${{ matrix.cxx_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -S .

    - name: Configure CMake (GCC)
      if: matrix.cxx_compiler == 'g++-15'
      run: >
        cmake -B build
        -DCMAKE_CXX_COMPILER=${{ matrix.cxx_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -S .

    - name: Configure CMake (MSVC)
      if: matrix.cxx_compiler == 'msvc'
      run: >
        cmake -B build
        -DPATRICK_ROBERTS_BUILD_EXAMPLES=OFF
        -S .

    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }}

    - name: Test
      working-directory: build
      run: ctest --build-config ${{ matrix.build_type }}
